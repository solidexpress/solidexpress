name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ curl unzip \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-ocaf-dev \
            libocct-data-exchange-dev libocct-visualization-dev \
            libocct-draw-dev \
            libeigen3-dev libboost-dev libboost-graph-dev libtbb-dev

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync VERSION file with tag
        run: echo "${{ steps.ver.outputs.version }}" > VERSION

      - name: Fetch Godot editor + export templates
        run: |
          chmod +x scripts/release/fetch-godot-templates.sh
          ./scripts/release/fetch-godot-templates.sh

      - name: Run kernel tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)" --target sxkernel_tests
          ./build/sxkernel/sxkernel_tests

      - name: Export Linux release
        run: |
          chmod +x scripts/release/export-linux.sh
          ./scripts/release/export-linux.sh


      - name: Build Flatpak bundle
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 || true
          chmod +x packaging/flatpak/build-flatpak.sh
          ./packaging/flatpak/build-flatpak.sh || echo "flatpak skipped if tarball layout mismatch"

      - name: Build Snap
        run: |
          sudo snap install snapcraft --classic || true
          chmod +x packaging/snap/build-snap.sh packaging/snap/wrapper
          ./packaging/snap/build-snap.sh || echo "snap skipped — run locally with LXD if CI fails"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolidExpress-linux-x86_64
          path: |
            dist/releases/SolidExpress-*.tar.gz
            dist/releases/SolidExpress-*.flatpak
            dist/releases/*.snap
            dist/releases/SolidExpress-*.sha256

  windows:
    runs-on: windows-latest
    env:
      # Reuse compiled OCCT/Boost/TBB/etc across runs (first run still builds from source).
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install build dependencies
        shell: bash
        run: |
          choco install ninja cmake -y
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg.exe" install opencascade eigen3 tbb boost-system boost-filesystem boost-graph --triplet x64-windows

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync VERSION
        shell: bash
        run: echo "${{ steps.ver.outputs.version }}" > VERSION

      - name: Fetch Godot
        shell: bash
        run: |
          chmod +x scripts/release/fetch-godot-templates.sh
          ./scripts/release/fetch-godot-templates.sh

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Export Windows release
        shell: bash
        run: |
          chmod +x scripts/release/export-windows.sh
          ./scripts/release/export-windows.sh


      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Inno installer
        shell: bash
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          SRC="dist/releases/SolidExpress-${VER}-windows-x86_64"
          "$ISCC" "/DMyAppVersion=$VER" "/DMySourceDir=$SRC" packaging/windows/SolidExpress.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolidExpress-windows-x86_64
          path: |
            dist/releases/SolidExpress-*-windows-x86_64.zip
            dist/releases/SolidExpress-*-x64-setup.exe
            dist/releases/SolidExpress-*-windows-x86_64.zip
            dist/releases/SolidExpress-*-x64-setup.exe.sha256

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install cmake ninja opencascade eigen boost tbb

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync VERSION
        run: echo "${{ steps.ver.outputs.version }}" > VERSION

      - name: Fetch Godot
        run: |
          chmod +x scripts/release/fetch-godot-templates.sh
          ./scripts/release/fetch-godot-templates.sh

      - name: Export macOS release
        run: |
          chmod +x scripts/release/export-macos.sh
          ./scripts/release/export-macos.sh


      - name: Build DMG
        run: |
          chmod +x packaging/macos/create-dmg.sh
          ./packaging/macos/create-dmg.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolidExpress-macos
          path: |
            dist/releases/SolidExpress-*-macos.zip
            dist/releases/SolidExpress-*-macos.dmg
            dist/releases/SolidExpress-*-macos.zip
            dist/releases/SolidExpress-*-macos.dmg.sha256

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: SolidExpress-linux-x86_64
          path: dist/releases

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SolidExpress-windows-x86_64
          path: dist/releases

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SolidExpress-macos
          path: dist/releases

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/releases/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
