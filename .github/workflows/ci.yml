name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Keep in sync with packaging/occt.version and vcpkg.json overrides.
  OCCT_VERSION: "8.0.1"
  VCPKG_COMMIT: "3aea538b2bb21a586502c67b00eb474fdd2e3098"

jobs:
  website-demos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unpublished frontpage / features demos
        run: |
          chmod +x scripts/sx-check-website-demos
          ./scripts/sx-check-website-demos

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin Windows vcpkg cache key
        run: python3 scripts/release/test_windows_vcpkg_cache_key.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ curl ca-certificates \
            libeigen3-dev libboost-dev libboost-graph-dev libtbb-dev \
            libfreetype-dev libfontconfig-dev rapidjson-dev \
            libx11-dev libxi-dev libxext-dev libxmu-dev libgl1-mesa-dev

      - name: Cache OCCT ${{ env.OCCT_VERSION }}
        uses: actions/cache@v4
        with:
          path: /opt/occt-${{ env.OCCT_VERSION }}
          key: occt-${{ env.OCCT_VERSION }}-linux-x64-shared-tbb-freetype-rapidjson-v1

      - name: Install OCCT ${{ env.OCCT_VERSION }} from source
        run: |
          chmod +x packaging/ci/install_occt.sh
          sudo mkdir -p "/opt/occt-${OCCT_VERSION}"
          sudo chown "$(id -u):$(id -g)" "/opt/occt-${OCCT_VERSION}"
          OCCT_PREFIX="/opt/occt-${OCCT_VERSION}" packaging/ci/install_occt.sh

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="/opt/occt-${OCCT_VERSION}" \
            -DSX_BUILD_GDEXTENSION=OFF -DSX_BUILD_VOICE=OFF

      - name: Build kernel tests
        run: cmake --build build -j "$(nproc)" --target sxkernel_tests

      - name: Run kernel tests
        run: |
          export LD_LIBRARY_PATH="/opt/occt-${OCCT_VERSION}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./build/sxkernel/sxkernel_tests

  # Populate the Windows vcpkg binary cache (main + PRs) so tag releases can
  # restore it. Also exercises the exact vcpkg OCCT pin used by export.
  windows-vcpkg:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-win-x64-occt-8.0.1-eigen3-tbb-boost-system-filesystem-graph
          restore-keys: |
            vcpkg-win-x64-occt-8.0.1-
            vcpkg-win-x64-

      - name: Install vcpkg packages
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/vcpkg-binary-cache"
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat"
          mkdir -p "$RUNNER_TEMP/vcpkg/downloads"
          curl -fsSL --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/vcpkg/downloads/boost-1.91.0-LICENSE_1_0.txt" \
            "https://github.com/boostorg/boost/raw/boost-1.91.0/LICENSE_1_0.txt" \
            || curl -fsSL --retry 5 --retry-all-errors \
              -o "$RUNNER_TEMP/vcpkg/downloads/boost-1.91.0-LICENSE_1_0.txt" \
              "https://raw.githubusercontent.com/boostorg/boost/boost-1.91.0/LICENSE_1_0.txt" \
            || true
          ok=0
          for attempt in 1 2 3; do
            echo "==> vcpkg install attempt ${attempt}/3"
            if "$RUNNER_TEMP/vcpkg/vcpkg.exe" install --triplet x64-windows \
                --x-manifest-root="${GITHUB_WORKSPACE}"; then
              ok=1
              break
            fi
            echo "vcpkg install failed on attempt ${attempt}; sleeping before retry"
            sleep 20
          done
          [[ "$ok" -eq 1 ]] || exit 1

  # Windows: vcpkg OCCT 8.0.1 → kernel tests → Godot export (same path as
  # release.yml "Export Windows release"). No tags, no GitHub Release, no publish.
  windows-export:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-win-x64-occt-8.0.1-eigen3-tbb-boost-system-filesystem-graph
          restore-keys: |
            vcpkg-win-x64-occt-8.0.1-
            vcpkg-win-x64-

      - name: Install vcpkg packages
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/vcpkg-binary-cache"
          choco install ninja cmake -y --no-progress
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat"
          echo "SX_VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg/downloads"
          curl -fsSL --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/vcpkg/downloads/boost-1.91.0-LICENSE_1_0.txt" \
            "https://github.com/boostorg/boost/raw/boost-1.91.0/LICENSE_1_0.txt" \
            || true
          ok=0
          for attempt in 1 2 3; do
            echo "==> vcpkg install attempt ${attempt}/3"
            if "$RUNNER_TEMP/vcpkg/vcpkg.exe" install --triplet x64-windows \
                --x-manifest-root="${GITHUB_WORKSPACE}"; then
              ok=1
              break
            fi
            sleep 20
          done
          [[ "$ok" -eq 1 ]] || exit 1

      - name: Fetch Godot editor + export templates
        shell: bash
        run: |
          chmod +x scripts/release/fetch-godot-templates.sh
          ./scripts/release/fetch-godot-templates.sh

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Restore project vcpkg root
        shell: bash
        run: |
          if [[ -n "${SX_VCPKG_ROOT:-}" ]]; then
            echo "VCPKG_ROOT=$SX_VCPKG_ROOT" >> "$GITHUB_ENV"
            echo "Restored VCPKG_ROOT=$SX_VCPKG_ROOT"
          fi

      - name: Configure + build + run kernel tests
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}" \
            -DSX_BUILD_GDEXTENSION=OFF -DSX_BUILD_VOICE=OFF
          cmake --build build -j "$(nproc)" --target sxkernel_tests
          # planegcs.dll is emitted to game/bin; stage it (+ OCCT/TBB) beside the
          # test exe before running — bare ./sxkernel_tests exits 127 in Git Bash
          # when a DLL is missing.
          chmod +x packaging/ci/run_windows_kernel_tests.sh
          packaging/ci/run_windows_kernel_tests.sh

      - name: Export Windows release (no publish)
        shell: bash
        run: |
          # Reconfigure with GDExtension for sxcore; export-windows.sh builds sxcore itself.
          chmod +x scripts/release/export-windows.sh
          ./scripts/release/export-windows.sh

      - name: Upload Windows export folder (PR evidence; not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: SolidExpress-windows-x86_64-pr
          path: dist/releases/SolidExpress-*-windows-x86_64/
          if-no-files-found: error
          retention-days: 7

  # PR/push compile check: macOS kernel against source-built OCCT 8.0.1.
  macos-kernel:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install cmake ninja eigen boost tbb freetype rapidjson

      - name: Cache OCCT ${{ env.OCCT_VERSION }}
        uses: actions/cache@v4
        with:
          path: /opt/occt-${{ env.OCCT_VERSION }}
          key: occt-${{ env.OCCT_VERSION }}-macos-arm64-shared-tbb-freetype-rapidjson-v1

      - name: Install OCCT ${{ env.OCCT_VERSION }} from source
        run: |
          chmod +x packaging/ci/install_occt.sh
          sudo mkdir -p "/opt/occt-${OCCT_VERSION}"
          sudo chown "$(id -u):$(id -g)" "/opt/occt-${OCCT_VERSION}"
          OCCT_PREFIX="/opt/occt-${OCCT_VERSION}" packaging/ci/install_occt.sh

      - name: Configure + build kernel tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="/opt/occt-${OCCT_VERSION}" \
            -DSX_BUILD_GDEXTENSION=OFF -DSX_BUILD_VOICE=OFF
          cmake --build build -j "$(sysctl -n hw.ncpu)" --target sxkernel_tests

      - name: Run kernel tests
        run: |
          export DYLD_LIBRARY_PATH="/opt/occt-${OCCT_VERSION}/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          ./build/sxkernel/sxkernel_tests

  # Godot headless suites need a local Godot binary (tools/godot/godot).
  godot-smoke:
    runs-on: ubuntu-24.04
    needs: kernel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ unzip curl ca-certificates \
            libeigen3-dev libboost-dev libboost-graph-dev libtbb-dev \
            libfreetype-dev libfontconfig-dev rapidjson-dev \
            libx11-dev libxi-dev libxext-dev libxmu-dev libgl1-mesa-dev \
            mesa-vulkan-drivers

      - name: Cache OCCT ${{ env.OCCT_VERSION }}
        uses: actions/cache@v4
        with:
          path: /opt/occt-${{ env.OCCT_VERSION }}
          key: occt-${{ env.OCCT_VERSION }}-linux-x64-shared-tbb-freetype-rapidjson-v1

      - name: Install OCCT ${{ env.OCCT_VERSION }} from source
        run: |
          chmod +x packaging/ci/install_occt.sh
          sudo mkdir -p "/opt/occt-${OCCT_VERSION}"
          sudo chown "$(id -u):$(id -g)" "/opt/occt-${OCCT_VERSION}"
          OCCT_PREFIX="/opt/occt-${OCCT_VERSION}" packaging/ci/install_occt.sh

      - name: Cache Godot 4.7-stable binary
        uses: actions/cache@v4
        with:
          path: tools/godot/godot
          key: godot-${{ runner.os }}-4.7-stable-linux-x86_64
          restore-keys: |
            godot-${{ runner.os }}-4.7-stable-
            godot-

      - name: Fetch pinned Godot editor (4.7-stable)
        run: |
          chmod +x packaging/ci/fetch_godot.sh
          GODOT_VERSION=4.7-stable packaging/ci/fetch_godot.sh
          tools/godot/godot --version

      - name: Configure + build (GDExtension + kernel)
        run: |
          export CMAKE_PREFIX_PATH="/opt/occt-${OCCT_VERSION}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          export LD_LIBRARY_PATH="/opt/occt-${OCCT_VERSION}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          make build

      # Gate a minimal set of Godot suites. If a suite starts timing out the whole job,
      # isolate just that suite with continue-on-error and link the regression to 6.0b/c.
      - name: Run headless Godot gated suites
        run: |
          export LD_LIBRARY_PATH="/opt/occt-${OCCT_VERSION}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          chmod +x packaging/ci/run_godot_suites.sh
          packaging/ci/run_godot_suites.sh
