name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin Windows vcpkg cache key
        run: python3 scripts/release/test_windows_vcpkg_cache_key.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-ocaf-dev \
            libocct-data-exchange-dev libocct-visualization-dev \
            libocct-draw-dev \
            libeigen3-dev libboost-dev libboost-graph-dev libtbb-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DSX_BUILD_GDEXTENSION=OFF -DSX_BUILD_VOICE=OFF

      - name: Build kernel tests
        run: cmake --build build -j "$(nproc)" --target sxkernel_tests

      - name: Run kernel tests
        run: ./build/sxkernel/sxkernel_tests

  # Populate the Windows vcpkg binary cache on main so tag releases can restore it.
  # Release runs only on tags; without a main-scoped cache, each release rebuilds from scratch.
  windows-vcpkg:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-win-x64-opencascade-eigen3-tbb-boost-system-filesystem-graph
          restore-keys: |
            vcpkg-win-x64-

      - name: Install vcpkg packages
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/vcpkg-binary-cache"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat"
          mkdir -p "$RUNNER_TEMP/vcpkg/downloads"
          curl -fsSL --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/vcpkg/downloads/boost-1.91.0-LICENSE_1_0.txt" \
            "https://github.com/boostorg/boost/raw/boost-1.91.0/LICENSE_1_0.txt" \
            || curl -fsSL --retry 5 --retry-all-errors \
              -o "$RUNNER_TEMP/vcpkg/downloads/boost-1.91.0-LICENSE_1_0.txt" \
              "https://raw.githubusercontent.com/boostorg/boost/boost-1.91.0/LICENSE_1_0.txt" \
            || true
          ok=0
          for attempt in 1 2 3; do
            echo "==> vcpkg install attempt ${attempt}/3"
            if "$RUNNER_TEMP/vcpkg/vcpkg.exe" install opencascade eigen3 tbb boost-system boost-filesystem boost-graph --triplet x64-windows; then
              ok=1
              break
            fi
            echo "vcpkg install failed on attempt ${attempt}; sleeping before retry"
            sleep 20
          done
          [[ "$ok" -eq 1 ]] || exit 1

  # Godot headless suites. Narrow gate first: parse-sweep (catches uncompiled
  # GDScript), integration, and layout. Widen after Wave 6.0 suites go green.
  godot-smoke:
    runs-on: ubuntu-24.04
    needs: kernel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ zip \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-ocaf-dev \
            libocct-data-exchange-dev libocct-visualization-dev \
            libocct-draw-dev \
            libeigen3-dev libboost-dev libboost-graph-dev libtbb-dev \
            mesa-vulkan-drivers libgl1-mesa-dri

      - name: Cache Godot 4.7-stable
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: tools/godot/godot
          key: godot-4.7-stable-linux-x86_64

      - name: Fetch Godot 4.7-stable
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/godot /tmp/godotdl
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godotdl
          cp /tmp/godotdl/Godot_v4.7-stable_linux.x86_64 tools/godot/godot
          chmod +x tools/godot/godot

      - name: Build
        run: make build

      - name: Parse sweep + Wave 0/6 gate suites
        run: |
          make import
          tools/godot/godot --headless --path game --script tests/run_parse_sweep_tests.gd
          tools/godot/godot --headless --path game --script tests/run_tests.gd
          tools/godot/godot --headless --path game --script tests/run_layout_tests.gd
          tools/godot/godot --headless --path game --script tests/run_ui_tests.gd
          tools/godot/godot --headless --path game --script tests/run_workflow_tests.gd
          tools/godot/godot --headless --path game --script tests/run_print_tests.gd
          tools/godot/godot --headless --path game --script tests/run_open_in_slicer_tests.gd
          tools/godot/godot --headless --path game --script tests/run_property_tests.gd
          tools/godot/godot --headless --path game --script tests/run_menu_tests.gd
          tools/godot/godot --headless --path game --script tests/run_hole_wizard_tests.gd
          tools/godot/godot --headless --path game --script tests/run_clearance_tests.gd
          tools/godot/godot --headless --path game --script tests/run_dead_chrome_tests.gd
          tools/godot/godot --headless --path game --script tests/run_ui_button_coverage_tests.gd
          tools/godot/godot --headless --path game --script tests/run_see_the_print_tests.gd

