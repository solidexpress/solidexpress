name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-ocaf-dev \
            libocct-data-exchange-dev libocct-visualization-dev \
            libocct-draw-dev \
            libeigen3-dev libboost-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DSX_BUILD_GDEXTENSION=OFF -DSX_BUILD_VOICE=OFF

      - name: Build kernel tests
        run: cmake --build build -j "$(nproc)" --target sxkernel_tests

      - name: Run kernel tests
        run: ./build/sxkernel/sxkernel_tests

  # Godot headless suites need a local Godot binary (tools/godot/godot).
  # Enable when the CI image caches that binary; until then kernel is the gate.
  godot-smoke:
    if: false
    runs-on: ubuntu-24.04
    needs: kernel
    steps:
      - uses: actions/checkout@v4
      - run: echo "Godot CI reserved — enable when tools/godot is provisioned"
