name: solidexpress
title: SolidExpress
version: '0.0.1'
summary: Open parametric solid modeling
description: |
  SolidExpress — sketch, extrude, revolve, loft, sweep on OCCT B-rep solids.
grade: devel
confinement: strict
base: core24
architectures: [amd64]
apps:
  solidexpress:
    command: bin/wrapper
    plugs: [home, removable-media, opengl, wayland, x11, network-bind]
layout:
  /usr/lib/solidexpress:
    bind: $SNAP/lib
parts:
  solidexpress:
    plugin: dump
    source: ../../dist/releases/SolidExpress-0.0.1-linux-x86_64
    organize:
      '*': bin/
    override-build: |
      craftctl default
      mkdir -p "$SNAPCRAFT_PART_INSTALL/lib"
      mv "$SNAPCRAFT_PART_INSTALL/bin/"*.so "$SNAPCRAFT_PART_INSTALL/lib/" 2>/dev/null || true
      install -Dm755 "$CRAFT_PROJECT_DIR/packaging/snap/wrapper" "$SNAPCRAFT_PART_INSTALL/bin/wrapper"
