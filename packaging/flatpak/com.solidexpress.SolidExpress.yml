app-id: com.solidexpress.SolidExpress
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: SolidExpress.x86_64
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
modules:
  - name: solidexpress
    buildsystem: simple
    build-commands:
      - install -Dm755 SolidExpress.x86_64 /app/bin/SolidExpress.x86_64
      - install -Dm644 libsxcore.so /app/lib/libsxcore.so
      - install -Dm644 libplanegcs.so /app/lib/libplanegcs.so || true
      - install -Dm644 ../com.solidexpress.SolidExpress.desktop /app/share/applications/com.solidexpress.SolidExpress.desktop
      - install -Dm644 ../icon.png /app/share/icons/hicolor/512x512/apps/com.solidexpress.SolidExpress.png || true
    sources:
      - type: dir
        path: ../../../dist/releases/SolidExpress-0.0.1-linux-x86_64
      - type: file
        path: com.solidexpress.SolidExpress.desktop
      - type: file
        path: icon.png
        url: file://../../../docs/branding/logo.png
        sha256: skip
